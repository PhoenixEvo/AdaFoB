# AdaFoB Research Project - Frozen Label-Free Mask Selection Rule
# Pre-registered and frozen per Auditor Protocol Step 4.A
# Rationale:
# 1. Author recommendation: Meta AI (Kirillov et al., 2023, predictor.py:119-120) explicitly
#    recommends multimask_output=False for disambiguated multi-point input prompts.
# 2. Development split observation: On disjoint development subjects (protocol/dev_split.csv),
#    R1 (SingleMask) yielded higher empirical validation scores than R2 (ArgmaxScore) and R3 (mask[0])
#    on evaluated cases.
#    Hypothesis H_mech: Multimask token 0 may have different receptive field / ambiguity resolution
#    than single-mask output across backbones.
# 3. Note on mask_index: mask_index 0 here refers strictly to the single output slice of single-mask mode
#    (multimask_output=False), NOT mask[0] of multimask mode (which is token 1 in multimask output).
# 4. Zero label leakage: Evaluated label-free at inference without reading query ground truth.

rule_id: "R1"
rule_name: "SingleMask"
multimask_output: false
mask_index: 0 # Refers to the first output of single-mask mode, NOT mask[0] of multimask mode
provenance: "Meta AI Segment Anything (Kirillov et al., 2023) / Dev Split Observation (protocol/dev_split.csv)"
frozen_commit: "24e35bd"
date_frozen: "2026-10-22"
