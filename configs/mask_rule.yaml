# AdaFoB Research Project - Frozen Label-Free Mask Selection Rule
# Pre-registered and frozen per Auditor Protocol Step 4.A
# Rationale:
# 1. Architectural alignment: Uses SAM's dedicated non-ambiguous prompt token (Token 0).
# 2. Author recommendation: Meta AI (Kirillov et al., 2023, predictor.py:119-120) explicitly
#    recommends multimask_output=False for disambiguated multi-point input prompts.
# 3. Development split validation: On 100% disjoint development subjects (protocol/dev_split.csv),
